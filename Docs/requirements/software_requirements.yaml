# Software Requirements
# Ovaj fajl sadrži softverske requirements koje piše AI agent.

- id: REQ-SW-002
  name: Landing stranica za neulogovane korisnike
  status: Finished
  refines: REQ-004
  description: >
    Implementirati React stranicu za neulogovane korisnike koja sadrzi uvodni hero
    segment, pregled svrhe aplikacije, osnovne funkcionalnosti i jasno istaknute CTA
    akcije za registraciju i prijavu.

- id: REQ-SW-003
  name: Vizuelni stil javne pocetne stranice
  status: Finished
  refines: REQ-003
  description: >
    Definisati i primeniti konzistentan vizuelni stil javne pocetne stranice sa
    dominacijom bele, sive i svetloplave boje, uz akcente tamnoplave i crvene boje.
    Interfejs mora zadrzati profesionalan i jasan policijski identitet.

- id: REQ-SW-004
  name: Meni za neulogovane korisnike
  status: Finished
  refines: REQ-006
  description: >
    Implementirati meni za neulogovano stanje kroz levi sidebar sa stavkama Pocetna,
    Registracija i Prijava, uz prikaz odgovarajucih poziva na akciju unutar landing
    stranice.

- id: REQ-SW-005
  name: Desktop-only prikaz javne pocetne stranice
  status: Finished
  refines: REQ-028
  description: >
    Implementirati desktop-only pravilo za javnu pocetnu stranicu: primarni interfejs
    se prikazuje samo na desktop sirinama, dok se na manjim ekranima prikazuje poruka
    da aplikacija trenutno podrzava samo desktop uredjaje.

- id: REQ-SW-006
  name: Registraciona stranica sa validacijom
  status: Finished
  refines: REQ-008
  description: >
    Implementirati stranicu `/registracija` sa formom koja sadrzi polja za ime,
    prezime, email, lozinku i potvrdu lozinke. Potrebno je validirati neispravan email,
    prekratku lozinku i vec postojeci nalog, uz prikaz jasnih poruka o greskama.

- id: REQ-SW-007
  name: Stranica za prijavu i sesija korisnika
  status: Finished
  refines: REQ-009
  description: >
    Implementirati stranicu `/prijava` sa validacijom email adrese i lozinke, proverom
    postojanja naloga i autentifikacijom korisnika preko backend API-ja. Nakon
    uspesne prijave potrebno je preuzeti JWT token sa servera i cuvati ga u lokalnom
    storage-u kao klijentsku sesiju.

- id: REQ-SW-008
  name: Javna navigacija ka auth stranicama
  status: Finished
  refines: REQ-006
  description: >
    Obezbediti da javni meni i CTA akcije sa landing stranice vode na rute
    `/registracija` i `/prijava`, uz konzistentan prikaz levog sidebara na svim
    javnim i auth stranicama.

- id: REQ-SW-009
  name: Organizovana backend arhitektura
  status: In Progress
  refines: REQ-001
  description: >
    Implementirati Node.js + Express backend sa jasnom strukturom po slojevima
    (config, db, modules, middleware, utils), kako bi odrzavanje i dalje sirenje
    sistema bilo konzistentno i predvidivo.

- id: REQ-SW-010
  name: SQLite baza i odrzavanje podataka
  status: Finished
  refines: REQ-001
  description: >
    Uvesti SQLite bazu podataka sa inicijalizacionim migracijama, indeksima i
    maintenance podesavanjima (WAL, foreign_keys) radi stabilnog cuvanja korisnickih
    naloga i pouzdanog rada auth funkcionalnosti.

- id: REQ-SW-011
  name: Backend endpoint za registraciju
  status: Finished
  refines: REQ-008
  description: >
    Implementirati `POST /api/auth/register` endpoint koji validira ulazne podatke,
    proverava jedinstvenost email adrese, hesira lozinku i upisuje korisnika u SQLite
    bazu uz standardizovan JSON odgovor.

- id: REQ-SW-012
  name: Backend endpoint za prijavu i JWT
  status: Finished
  refines: REQ-009
  description: >
    Implementirati `POST /api/auth/login` endpoint koji proverava kredencijale korisnika,
    vraca validacionu gresku za neispravan unos i generise JWT token pri uspesnoj prijavi.

- id: REQ-SW-013
  name: Pocetna stranica za ulogovanog korisnika - Realni podaci iz baze
  status: In Review
  refines: REQ-005
  description: >
    Implementirati pocetnu stranicu za ulogovanog korisnika koja prikazuje dobrodoslicu sa imenom
    korisnika i stvarne podatke o slucajevima dobijene preko backend API-ja, bez mokovanog
    sadrzaja u prikazu listi i statistika, ukljucujuci i eksplicitan prikaz slucajeva u fazi
    kreiranja sa akcijom za nastavak uredjivanja, uz prikaz faze istrage koji koristi
    procenat trenutno otkljucanih timeline stavki za ulogovanog korisnika.

- id: REQ-SW-014
  name: Meni i routing za ulogovano stanje
  status: Finished
  refines: REQ-006
  description: >
    Implementirati meni za ulogovane korisnike sa stavkama Pocetna, Kreiranje slucaja,
    Profil i Odjava, kao i zasticen frontend routing koji preusmerava korisnika na
    odgovarajucu pocetnu stranicu nakon uspesne prijave i podrzava ulazak u tabove
    rezima resavanja i kreiranja slucaja.

- id: REQ-SW-015
  name: Model podataka za slucaj u SQLite bazi
  status: Finished
  refines: REQ-010
  description: >
    Uvesti strukturu tabele za slucaj i povezane entitete (osobe, dokumenti, stavke vremenske
    linije i korisnicki napredak kroz slucaj), sa stranim kljucevima, indeksima i ogranicenjima
    integriteta radi pouzdanog cuvanja i organizacije podataka.

- id: REQ-SW-016
  name: Backend API za kreiranje i cuvanje slucaja
  status: Finished
  refines: REQ-010
  description: >
    Implementirati zasticeni backend endpoint za kreiranje slucaja koji prihvata osnovne podatke,
    dokumente, osobe i vremensku liniju, validira payload i cuva sve povezane zapise unutar jedne
    transakcije.

- id: REQ-SW-017
  name: Backend pregled slucajeva za ulogovanu pocetnu
  status: Finished
  refines: REQ-005
  description: >
    Implementirati zasticeni backend endpoint za prikaz ulogovane pocetne stranice koji vraca
    stvarne sekcije slucajeva (aktivni, reseni, najbolje ocenjeni javni i kreirani slucajevi)
    i agregirane statistike korisnika.

- id: REQ-SW-018
  name: Pocetna forma za zapocinjanje kreiranja slucaja
  status: In Progress
  refines: REQ-019
  description: >
    Implementirati frontend formu na ruti `/slucaj/novi` sa obaveznim poljima za naziv i opis
    slucaja, koja poziva backend kreiranje draft slucaja i nakon uspesnog cuvanja automatski
    preusmerava korisnika na creatorski mod tog konkretnog slucaja i prvi tab workspace-a.

- id: REQ-SW-019
  name: Kosturni prikaz prozora za kreiranje slucaja
  status: In Review
  refines: REQ-029
  description: >
    Implementirati skeleton prikaz prozora creatorskog moda na ruti `/slucaj/:id/kreiranje`
    sa odvojenim podstranicama/tabovima za vremensku liniju, osobe i dosijee, dokumente,
    izjave, saslusanja i kviz, pri cemu tabovi `vremenska-linija`, `osobe-i-dosijei`,
    `dokumenti`, `izjave` i `saslusanja` imaju funkcionalne workflow-e, dok je tab
    `kviz` trenutno placeholder prikaz.

- id: REQ-SW-020
  name: Meni za rezim kreiranja slucaja
  status: In Review
  refines: REQ-029
  description: >
    Implementirati levi meni tokom kreiranja slucaja koji prikazuje tabove sekcija procesa
    (vremenska linija, osobe i dosijei, dokumenti, izjave, saslusanja, kviz), uz jasnu opciju
    za povratak na ulogovanu pocetnu i odjavu korisnika, bez dodatnog informativnog
    tekstualnog bloka o aktivnom slucaju i statusu tabova.

- id: REQ-SW-021
  name: Backend endpoint za creatorski prikaz pojedinacnog slucaja
  status: Finished
  refines: REQ-029
  description: >
    Implementirati JWT-zasticeni endpoint `GET /api/cases/:caseId/creator` koji vraca podatke
    slucaja samo autoru tog slucaja, uz validaciju identifikatora i kontrolu pristupa.

- id: REQ-SW-022
  name: Routing za creatorski mod po identifikatoru slucaja
  status: Finished
  refines: REQ-029
  description: >
    Implementirati frontend podrsku za dinamicke rute po identifikatoru slucaja za oba moda
    (`/slucaj/:id/kreiranje/:tab` i `/slucaj/:id/resavanje/:tab`), sa ucitavanjem draft slucaja
    u creatorskom modu i prikazom odgovarajuce prazne stranice za trazeni tab.

- id: REQ-SW-023
  name: Ujednacen set tabova za kreiranje i resavanje slucaja
  status: Finished
  refines: REQ-012
  description: >
    Obezbediti da prozor slucaja koristi isti set tabova menija u oba moda (kreiranje i
    resavanje), pri cemu svaki tab otvara posebnu stranicu u odgovarajucem modu.

- id: REQ-SW-024
  name: Dugme za objavu u rezimu kreiranja
  status: Finished
  refines: REQ-027
  description: >
    Obezbediti da opcija `Objavi slucaj` stoji u meniju rezima kreiranja kao posebno dugme
    bez navigacije na novu stranicu/tab, dok se puna logika potvrde i backend objave ne uvedu.

- id: REQ-SW-025
  name: Backend model i API za osobe i dosijee u slucaju
  status: In Review
  refines: REQ-015
  description: >
    Implementirati prosiren SQLite model dosijea osobe (ukljucujuci administrativne
    auto-generisane podatke kao broj dosijea, klasifikaciju i reviziju), podrsku za cuvanje
    fotografije osobe, kao i JWT-zasticene
    endpointe `GET /api/cases/:caseId/people` i `POST /api/cases/:caseId/people`, pri cemu
    GET podrzava `scope=solve` za timeline-otkljucan prikaz osoba po korisniku, a POST ostaje
    za autora slucaja, uz validaciju ulaza i vracanje strukturisanih podataka osobe i formalnog dosijea.

- id: REQ-SW-026
  name: Tab osobe i dosijei - kreiranje i pregled
  status: In Review
  refines: REQ-014
  description: >
    Implementirati funkcionalan tab `osobe-i-dosijei` u case workspace-u koji na glavnom
    prikazu pokazuje listu osoba sa osnovnim podacima, dok se kreiranje nove osobe/dosijea
    i pregled detaljnog formalnog dosijea obavljaju kroz iskacuce prozore (modale), uz
    padajuce liste za sva pogodna polja i posebno prilagodjen uvodni prikaz taba za
    creatorski i rezim resavanja, pri cemu u rezimu resavanja prikazuje samo osobe koje su
    otkljucane na vremenskoj liniji, kao i sekciju povezanih dokumenata/izjava sa direktnim
    linkovima ka konkretnim stavkama, uz akciju `Saslusaj osobu` koja iz dosijea otvara
    tab saslusanja u rezimu pregleda za konkretnu osobu.

- id: REQ-SW-027
  name: Backend API za izjave u slucaju
  status: In Review
  refines: REQ-017
  description: >
    Implementirati JWT-zasticene endpointe `GET /api/cases/:caseId/statements` i
    `POST /api/cases/:caseId/statements`, pri cemu GET podrzava `scope=solve` i vraca samo
    timeline-otkljucane izjave (uz filtriranje prikaza povezanih osoba na otkljucane), dok je
    POST za autora slucaja, sa validacijom formalnih
    polja izjave (tip, naslov, sadrzaj, klasifikacija, datum, lokacija, sluzbenik,
    davalac izjave i povezane osobe), kao i tip-specificnih polja po vrsti izjave
    (`witness_statement`, `suspect_statement`, `victim_statement`) uz cuvanje u metapodacima.

- id: REQ-SW-028
  name: Backend API za policijska dokumenta u slucaju
  status: In Review
  refines: REQ-018
  description: >
    Implementirati JWT-zasticene endpointe `GET /api/cases/:caseId/police-documents` i
    `POST /api/cases/:caseId/police-documents`, pri cemu GET podrzava `scope=solve` i vraca
    samo timeline-otkljucane dokumente (uz filtriranje prikaza povezanih osoba na otkljucane),
    dok je POST za autora slucaja, uz validaciju i cuvanje
    policijskih izvjestaja i forenzickih nalaza sa formalnim metapodacima, tip-specificnim
    poljima po tipu dokumenta i fotodokumentacijom (`imageEvidence`) za `police_report`
    i `forensic_report`, zajedno sa vezama na osobe.

- id: REQ-SW-029
  name: Tab izjave - kreiranje i formalni pregled
  status: In Review
  refines: REQ-017
  description: >
    Implementirati funkcionalan tab `izjave` u case workspace-u koji prikazuje listu i filtere,
    modal za kreiranje novih izjava i modal za formalni pregled svake izjave u ozbiljnom
    policijskom stilu, uz dinamicna tip-specificna polja u formi po izabranom tipu izjave,
    sa read-only rezimom u modu resavanja slucaja koji prikazuje samo timeline-otkljucane
    izjave i linkovima ka dosijeima povezanih osoba.

- id: REQ-SW-030
  name: Tab dokumenti - kreiranje i formalni pregled
  status: In Review
  refines: REQ-018
  description: >
    Implementirati funkcionalan tab `dokumenti` u case workspace-u za policijske izvjestaje
    i forenzicke nalaze, sa listom/filterima, modalnim kreiranjem i formalnim prikazom
    dokumenta, uz dinamicna tip-specificna polja i upload slika za oba tipa dokumenta,
    kao i read-only ogranicenje u rezimu resavanja koje prikazuje samo timeline-otkljucane
    dokumente i linkove ka dosijeima povezanih osoba.

- id: REQ-SW-031
  name: Objedinjeni creatorski workflow za tri tipa dokumentacije
  status: Finished
  refines: REQ-021
  description: >
    Obezbediti konzistentan workflow kreiranja i pregleda sva tri tipa dokumentacije u slucaju
    (dosije osobe, izjave i policijska dokumenta), sa istim obrascem rada kroz listu, modalni
    unos i formalni dokument prikaz, uz prilagodjena polja po tipu dokumenta i prikaz
    multimedijalnih dokaza tamo gde su podrzani.

- id: REQ-SW-032
  name: Dvosmerna navigacija osobe <-> dokumenti
  status: Finished
  refines: REQ-015
  description: >
    Obezbediti dvosmerne linkove izmedju dosijea osobe i dokumentacije slucaja:
    iz dosijea ka svim povezanim izjavama i policijskim/forenzickim dokumentima, kao i
    iz formalnog prikaza izjave/dokumenta ka dosijeima svih povezanih osoba.

- id: REQ-SW-033
  name: Backend model i API za saslusanja po osobi
  status: Finished
  refines: REQ-020
  description: >
    Implementirati SQLite model za saslusanja (`case_interrogations` i
    `case_interrogation_nodes`) i JWT-zasticene endpointe
    `GET /api/cases/:caseId/interrogations` i `POST /api/cases/:caseId/interrogations`,
    pri cemu GET podrzava `scope=solve` i vraca samo saslusanja za timeline-otkljucane osobe,
    dok POST ostaje autorski endpoint koji cuva i vraca stablo pitanja/odgovora po osobi uz validaciju strukture stabla,
    ukljucujuci `questionReferenceKey` mehanizam za ponovno koriscenje pitanja i pravilo da
    isto pitanje ne moze biti ponovljeno u istoj grani saslusanja.

- id: REQ-SW-034
  name: Creatorski editor saslusanja po osobi
  status: Finished
  refines: REQ-020
  description: >
    Implementirati creatorski workflow u tabu `saslusanja` koji omogucava izbor osobe,
    kreiranje/azuriranje saslusanja kroz unos stabla pitanja i odgovora i cuvanje
    saslusanja vezanog za konkretnu osobu, uz vizuelni prikaz stabla tokom kreiranja i
    opciju da se pitanje ponovi na vise mesta u razlicitim granama toka.

- id: REQ-SW-035
  name: Pokretanje saslusanja kroz chat modal
  status: Finished
  refines: REQ-016
  description: >
    Implementirati pregled i pokretanje saslusanja kroz zaseban chat modal u kome
    korisnik bira pitanje, dobija pripadajuci odgovor i nastavlja kroz sledece grane
    unapred pripremljenog stabla, uz unapredjeni chat-prikaz i akciju `Zakljuci saslusanje`
    koja postaje dostupna kada se dodje do kraja izabrane grane, pri cemu se u rezimu
    resavanja prikazuju samo saslusanja za osobe koje su otkljucane kroz vremensku liniju.

- id: REQ-SW-036
  name: Navigacija iz dosijea ka saslusanju osobe
  status: Finished
  refines: REQ-015
  description: >
    Obezbediti da iz svakog dosijea postoji akcija `Saslusaj osobu` koja otvara
    tab `saslusanja` u rezimu pregleda i automatski pokusava da pokrene saslusanje
    za izabranu osobu.

- id: REQ-SW-037
  name: Backend API za vremensku liniju slucaja
  status: Finished
  refines: REQ-022
  description: >
    Implementirati JWT-zasticene endpointe `GET /api/cases/:caseId/timeline`,
    `PUT /api/cases/:caseId/timeline` i `POST /api/cases/:caseId/timeline/advance`,
    sa validacijom timeline stavki (tip, referenca, jedinstvenost, napomena,
    datum/vreme otkljucavanja), atomskim cuvanjem redosleda, korisnickim
    otkljucavanjem sledece stavke i odrzavanjem `case_user_progress` procenta
    istrage na osnovu broja otkljucanih timeline stavki.

- id: REQ-SW-038
  name: Tab vremenska linija - kreiranje i pregled roadmap-a
  status: Finished
  refines: REQ-013
  description: >
    Implementirati funkcionalan tab `vremenska-linija` u case workspace-u koji u
    creatorskom modu omogucava dodavanje osoba/dokumenata u redosled otkljucavanja,
    pomeranje stavki gore-dole, uklanjanje, unos napomene i opcionalnog datuma/vremena,
    kao i cuvanje cele sekvence kroz backend API, dok u rezimu resavanja omogucava
    postepeno otkljucavanje kroz dugme `Dalje`, prikaz trenutnog datuma kao datuma
    poslednje otkljucane stavke, obrnuti redosled prikaza (najnovije prvo) i prikaz
    faze istrage prema procentu otkljucanih timeline stavki.

- id: REQ-SW-039
  name: Backend model i API za korisnicke support tickete
  status: Finished
  refines: REQ-031
  description: >
    Uvesti SQLite tabelu `support_tickets` i JWT-zasticene endpointe
    `GET /api/support/tickets/me` i `POST /api/support/tickets` za kreiranje i pregled
    korisnickih tiketa (bug report ili predlog poboljsanja), sa statusima
    `open`, `reviewed`, `in_progress`, `rejected`, `closed` i metapodacima
    o lokaciji u aplikaciji, verziji aplikacije i vremenu prijave.

- id: REQ-SW-040
  name: Korisnicki panel za podrsku u glavnoj aplikaciji
  status: Finished
  refines: REQ-031
  description: >
    Implementirati novu stranicu `/podrska` u ulogovanom meniju, sa formom za prijavu
    problema/predloga i listom svih tiketa prijavljenih od strane trenutno ulogovanog
    korisnika, ukljucujuci prikaz trenutnog statusa svakog tiketa.

- id: REQ-SW-041
  name: Admin autentifikacija i backend API za administraciju
  status: Finished
  refines: REQ-032
  description: >
    Implementirati admin autentifikaciju preko endpointa `POST /api/admin/login`
    (email + lozinka naloga + lozinka admin panela), admin JWT scope zastitu i
    administratorske endpointe za pregled i izmenu korisnika, slucajeva i support tiketa
    bez pristupa hashiranim lozinkama.

- id: REQ-SW-042
  name: Odvojen admin panel na zasebnom portu
  status: Finished
  refines: REQ-032
  description: >
    Implementirati poseban React + Vite admin frontend (`admin-frontend`) koji radi
    na zasebnom portu `5174`, sa login stranicom i dashboard prikazom za:
    1) pregled i promenu statusa support tiketa,
    2) pregled i izmenu korisnickih podataka (bez lozinki),
    3) pregled i izmenu podataka o slucajevima.
